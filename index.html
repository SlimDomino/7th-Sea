<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blood &amp; Iron - a 7th Sea Adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nosifer&family=Cinzel+Decorative:wght@700;900&family=Cormorant+Garamond:ital,wght@1,600;1,700&display=swap" rel="stylesheet">
<style>
  /* ---- Header ---- */
  header.title { text-align:center; margin:8px 0 6px; }
  .presents { font:italic 600 22px 'Cormorant Garamond', Georgia, serif; color:#3b2f22; margin:0; }
  h1.logo { margin:2px 0 0; line-height:1.15; font-weight:normal; }
  /* Blood and Iron are sized so their capital letters are the same height. Both slanted (italic). */
  .logo .blood, .logo .amp, .logo .iron { font-style:italic; display:inline-block; }
  .logo .blood { font-family:'Nosifer', Impact, sans-serif; font-size:64px; padding-right:6px; color:#8b0000; letter-spacing:1px; text-shadow:0 2px 0 #3a0000; }
  .logo .amp { font-family:'Cinzel Decorative', Georgia, serif; font-weight:700; font-size:44px; color:#3b2f22; margin:0 10px; }
  .logo .iron { font-family:'Cinzel Decorative', Georgia, serif; font-weight:900; font-size:52px; letter-spacing:2px; padding-right:6px;
    background:linear-gradient(180deg,#eef1f3 0%,#9aa3ab 42%,#4a5056 55%,#c3c9ce 100%);
    -webkit-background-clip:text; background-clip:text; color:#5a6168; -webkit-text-fill-color:transparent; -webkit-text-stroke:1px #2b2f33; }
  .tagline { display:block; font:italic 700 28px 'Cormorant Garamond', Georgia, serif; color:#3b2f22; margin-top:4px; }
  @media (max-width:600px) { .logo .blood { font-size:31px; padding-right:3px; } .logo .amp { font-size:22px; margin:0 4px; } .logo .iron { font-size:25px; letter-spacing:1px; padding-right:3px; } .tagline { margin-top:2px; font-size:21px; } .presents { font-size:17px; } }
  /* ---- Two big section buttons ---- */
  .hub { display:grid; grid-template-columns:repeat(2, minmax(0, 300px)); justify-content:center; gap:18px; margin:30px 0 8px; }
  .hub button { position:relative; height:190px; border:2px solid #5a1616; border-radius:12px; overflow:hidden; cursor:pointer; padding:0;
    font:700 23px 'Cormorant Garamond', Georgia, serif; color:#fff; box-shadow:0 3px 10px rgba(0,0,0,.25); transition:transform .12s, box-shadow .12s; }
  .hub button:hover { transform:translateY(-2px); box-shadow:0 6px 16px rgba(0,0,0,.3); }
  .hub button[aria-pressed="true"] { outline:4px solid #c9a227; outline-offset:2px; }
  .hub .label { position:absolute; left:0; right:0; bottom:0; padding:10px 8px; background:rgba(40,8,8,.78); }
  .hub .pics { background:url("images/7th-sea-map-combined.gif") center / cover; }
  .hub .files { background:url("assets/emilios-study.jpeg") center 35% / cover; }
  .hub .files { text-align:left; }
  .hub .peek { position:absolute; top:10px; left:10px; right:10px; list-style:none; margin:0; padding:8px 12px; border-radius:8px; background:rgba(28,14,6,.72); font:14px/1.45 system-ui, sans-serif; color:#fbeed0; }
  .hub .peek li { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hub .peek li::before { content:''; display:inline-block; width:11px; height:13px; margin-right:7px; vertical-align:-1px; border-radius:2px;
    background:linear-gradient(135deg,#fbeed0 0 70%, #d9b56a 70%); }
  .hub .peek li.more { color:#e6cf9a; font-style:italic; }
  .hub .peek li.more::before { display:none; }
  .hub .label svg { width:22px; height:22px; vertical-align:-4px; margin-right:6px; }
  @media (max-width:600px) { .hub { grid-template-columns:1fr 1fr; gap:10px; } .hub button { height:130px; font-size:17px; } .hub .peek { font-size:12px; top:7px; left:7px; right:7px; padding:6px 8px; line-height:1.4; } }
  section.panel { margin-top:10px; }
  h2#recaps-h { text-align:center; }
  :root { --bg:#fff; --fg:#000; --muted:#333; --card:rgba(255,255,255,.75); }
  @media (prefers-color-scheme: dark) { :root { --bg:#16181d; --fg:#000; --muted:#333; --card:rgba(255,255,255,.75); } }
  /* Background picture: change the file name below. Overlay darkness is the 0.65 values. */
  html { background:linear-gradient(rgba(255,255,255,.75),rgba(255,255,255,.75)), url("images/7th-sea-map-combined.gif") center / cover fixed; }
  body { margin:0; padding:16px; color:var(--fg); font:16px/1.5 system-ui, sans-serif; max-width:1100px; margin-inline:auto; }
  h1 { margin:0 0 4px; } h2 { margin-top:32px; }
  p.sub { color:var(--muted); margin-top:0; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:12px; }
  .grid a { background:var(--card); border-radius:8px; overflow:hidden; text-decoration:none; color:inherit; }
  .grid img { width:100%; height:180px; object-fit:cover; display:block; }
  .grid span { display:block; padding:6px 8px; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* Recap reading view (markdown rendered as a page) */
  .recap { max-width:72ch; max-height:85vh; overflow:auto; padding:28px 32px 36px; font:17px/1.65 Georgia, 'Times New Roman', serif; color:#1d1a16; background:#fbf7ee; }
  .recap h1 { text-align:left; font-size:28px; line-height:1.2; margin:0 40px 12px 0; color:#7a1f1f; }
  .recap h2 { font-size:21px; margin:30px 0 8px; padding-bottom:4px; border-bottom:1px solid #d8c9a8; color:#5a1616; }
  .recap h3 { font-size:18px; margin:22px 0 6px; }
  .recap p { margin:0 0 14px; }
  .recap ul, .recap ol { margin:0 0 14px; padding-left:24px; }
  .recap li { margin-bottom:6px; }
  .recap .meta { font:14px/1.6 system-ui, sans-serif; color:#5b5246; margin-bottom:18px; }
  .recap .meta b { color:#3a332a; }
  .recap .label { font:600 13px/1 system-ui, sans-serif; letter-spacing:.06em; text-transform:uppercase; color:#7a1f1f; margin:18px 0 8px; }
  .recap blockquote { margin:0 0 14px; padding-left:14px; border-left:3px solid #d8c9a8; font-style:italic; }
  .recap hr { border:0; border-top:1px solid #d8c9a8; margin:24px 0; }
  @media (max-width:600px) { .recap { padding:22px 18px 28px; font-size:16px; } .recap h1 { font-size:23px; } }
  /* Session recap buttons at the top of the page */
  .recaps { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; }
  .recaps button { font:inherit; font-size:15px; padding:10px 16px; border-radius:8px; border:1px solid #7a1f1f; background:var(--card); color:var(--fg); cursor:pointer; text-align:left; }
  .recaps button:hover { background:#7a1f1f; color:#fff; }
  .recaps button b { color:#7a1f1f; margin-right:2px; }
  .recaps button:hover b { color:#fff; }
  .filters { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 14px; }
  .filters button { font:inherit; font-size:14px; padding:6px 14px; border-radius:999px; border:1px solid #8a6d3b; background:var(--card); color:var(--fg); cursor:pointer; }
  .filters button:hover { background:#fff; }
  .filters button[aria-pressed="true"] { background:#7a1f1f; border-color:#7a1f1f; color:#fff; }
  .filters button small { opacity:.7; margin-left:4px; }
  .grid a[hidden] { display:none; }
  ul { padding-left:20px; } a { color:inherit; }
  dialog { border:0; padding:0; background:#fff; color:var(--fg); max-width:90vw; max-height:90vh; border-radius:8px; }
  dialog::backdrop { background:rgba(0,0,0,.7); }
  dialog img { max-width:90vw; max-height:85vh; display:block; }
  dialog pre { margin:0; padding:16px; white-space:pre-wrap; max-width:80ch; max-height:80vh; overflow:auto; }
  dialog button { position:absolute; top:6px; right:6px; }
  /* Picture viewer: back/forward arrows and caption */
  .photo { position:relative; }
  .photo img { margin:0 auto; }
  .photo figcaption { padding:8px 56px; text-align:center; font-size:14px; background:#fff; }
  .photo figcaption small { color:#555; margin-left:8px; white-space:nowrap; }
  dialog > button { z-index:2; width:36px; height:36px; border:0; border-radius:50%; background:rgba(0,0,0,.55); color:#fff; font-size:18px; cursor:pointer; }
  dialog .nav { top:50%; transform:translateY(-50%); right:auto; width:44px; height:64px; border:0; border-radius:8px;
    background:rgba(0,0,0,.45); color:#fff; font-size:30px; line-height:1; cursor:pointer; }
  dialog .nav:hover { background:rgba(0,0,0,.7); }
  dialog .nav.prev { left:6px; } dialog .nav.next { left:auto; right:6px; }
  dialog .nav[hidden] { display:none; }
</style>
</head>
<body>
<header class="title">
  <p class="presents">Real People Gaming presents:</p>
  <h1 class="logo"><span class="blood">Blood</span><span class="amp">&amp;</span><span class="iron">Iron</span>
    <span class="tagline">a 7th Sea Adventure</span></h1>
</header>
<h2 id="recaps-h">Session Recaps</h2>
<div class="recaps" id="recaps"></div>
<nav class="hub" aria-label="Sections">
  <button type="button" class="pics" data-panel="pictures" aria-pressed="false"><span class="label">Pictures &amp; Maps</span></button>
  <button type="button" class="files" data-panel="files" aria-pressed="false">
    <ul class="peek" id="peek" aria-hidden="true"></ul>
    <span class="label"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M6 14a4 4 0 0 1 4-4h14l6 6h24a4 4 0 0 1 4 4v4H6z" fill="#e0b85a"/><path d="M4 24h56l-4 28a4 4 0 0 1-4 3H10a4 4 0 0 1-4-3z" fill="#f2cf73"/></svg>All Files</span></button>
</nav>
<section class="panel" id="pictures" hidden>
<h2 id="images-h">Pictures &amp; Maps</h2>
<div class="filters" id="filters" role="group" aria-label="Picture categories"></div>
<div class="grid" id="images"></div>
</section>
<section class="panel" id="files" hidden>
<h2 id="texts-h">Text files</h2>
<ul id="texts"></ul>
<h2 id="pdfs-h">PDFs</h2>
<ul id="pdfs"></ul>
<h2 id="docs-h">Documents</h2>
<ul id="docs"></ul>
</section>
<dialog id="viewer"><button onclick="viewer.close()" aria-label="Close">✕</button><div id="content"></div></dialog>
<script>
const $ = id => document.getElementById(id);
const url = (dir, f) => dir + '/' + encodeURIComponent(f);
const name = f => f.replace(/\.[^.]+$/, '');
// Small markdown renderer for session recaps: headings, **bold**, *italic*,
// lists, quotes and rules. The "Played / In-game / Place" lines become a small
// header block, and character names in the Cast list are bolded.
function renderRecap(md) {
  const esc = t => t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const inline = t => esc(t)
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/(^|[^*])\*(?!\s)(.+?)\*(?!\*)/g, '$1<i>$2</i>');
  const lines = md.replace(/\r/g, '').split('\n');
  let html = '', list = null, para = [], meta = [], section = '';
  const flushPara = () => { if (para.length) html += '<p>' + inline(para.join(' ')) + '</p>'; para = []; };
  const flushList = () => { if (list) html += '</' + list + '>'; list = null; };
  const flushMeta = () => { if (meta.length) html += '<div class="meta">' + meta.join('<br>') + '</div>'; meta = []; };
  const flush = () => { flushPara(); flushList(); flushMeta(); };
  for (const raw of lines) {
    const line = raw.trimEnd(), t = line.trim();
    let m;
    if (!t) { flush(); continue; }
    if ((m = t.match(/^(#{1,3})\s+(.*)$/))) { flush(); const n = m[1].length; section = m[2]; html += '<h' + n + '>' + inline(m[2]) + '</h' + n + '>'; continue; }
    if (/^(-{3,}|\*{3,})$/.test(t)) { flush(); html += '<hr>'; continue; }
    if ((m = t.match(/^(Played|In-game|Place|Date|Location):\s*(.*)$/i))) { flushPara(); flushList(); meta.push('<b>' + esc(m[1]) + ':</b> ' + inline(m[2])); continue; }
    if (/^(Cast|Players)$/i.test(t)) { flush(); section = 'Cast'; html += '<div class="label">' + esc(t) + '</div>'; continue; }
    if ((m = t.match(/^[-*]\s+(.*)$/)) || (m = t.match(/^\d+\.\s+(.*)$/))) {
      flushPara(); flushMeta();
      const kind = /^\d/.test(t) ? 'ol' : 'ul';
      if (list !== kind) { flushList(); html += '<' + kind + '>'; list = kind; }
      let item = inline(m[1]);
      // Cast list: bold the character's name (everything before the " – Player" part).
      if (section === 'Cast') item = item.replace(/^(.+?)(\s[–—-]\s)/, '<b>$1</b>$2');
      html += '<li>' + item + '</li>'; continue;
    }
    if ((m = t.match(/^>\s?(.*)$/))) { flush(); html += '<blockquote>' + inline(m[1]) + '</blockquote>'; continue; }
    flushList(); flushMeta(); para.push(t);
  }
  flush();
  return html;
}
function show(node) { $('content').replaceChildren(node); if (!$('viewer').open) $('viewer').showModal(); }

// Picture viewer with back/forward arrows. Cycles through the pictures currently
// shown in the grid (so it respects the category filter). Arrow keys and
// swiping on a phone work too.
let gallery = [], current = -1;
function showPhoto(i) {
  if (!gallery.length) return;
  current = (i + gallery.length) % gallery.length;
  const a = gallery[current];
  const fig = document.createElement('figure');
  fig.className = 'photo'; fig.style.margin = 0;
  const img = new Image(); img.src = a.href; img.alt = a.dataset.title;
  const cap = document.createElement('figcaption');
  cap.textContent = a.dataset.title;
  if (gallery.length > 1) cap.insertAdjacentHTML('beforeend', '<small>' + (current + 1) + ' / ' + gallery.length + '</small>');
  const prev = document.createElement('button'), next = document.createElement('button');
  prev.className = 'nav prev'; prev.innerHTML = '&#8249;'; prev.setAttribute('aria-label', 'Previous picture');
  next.className = 'nav next'; next.innerHTML = '&#8250;'; next.setAttribute('aria-label', 'Next picture');
  prev.hidden = next.hidden = gallery.length < 2;
  prev.onclick = e => { e.stopPropagation(); showPhoto(current - 1); };
  next.onclick = e => { e.stopPropagation(); showPhoto(current + 1); };
  fig.append(img, cap, prev, next);
  show(fig);
  // Preload the neighbours so flipping is quick.
  for (const j of [current - 1, current + 1]) new Image().src = gallery[(j + gallery.length) % gallery.length].href;
}
function openPhoto(a) {
  gallery = [...$('images').children].filter(x => !x.hidden);
  showPhoto(gallery.indexOf(a));
}
document.addEventListener('keydown', e => {
  if (!$('viewer').open || current < 0) return;
  if (e.key === 'ArrowLeft') showPhoto(current - 1);
  if (e.key === 'ArrowRight') showPhoto(current + 1);
});
let touchX = null;
$('viewer').addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, { passive: true });
$('viewer').addEventListener('touchend', e => {
  if (touchX === null || current < 0) return;
  const dx = e.changedTouches[0].clientX - touchX; touchX = null;
  if (Math.abs(dx) > 50) showPhoto(current + (dx < 0 ? 1 : -1));
});
$('viewer').addEventListener('close', () => { current = -1; });
$('viewer').addEventListener('click', e => { if (e.target === e.currentTarget) e.currentTarget.close(); });

fetch('files.json', { cache: 'no-cache' }).then(r => r.json()).then(({ images, categories, texts, pdfs = [], docs = [] }) => {
  // Older files.json lists plain file names; treat those as uncategorized.
  images = images.map(f => typeof f === 'string' ? { src: url('images', f), title: name(f), category: 'Other' } : { ...f, src: f.src.split('/').map(encodeURIComponent).join('/') });
  categories = categories || [...new Set(images.map(i => i.category))];
  for (const img of images) {
    const a = document.createElement('a');
    a.href = img.src; a.dataset.category = img.category; a.dataset.title = img.title;
    a.innerHTML = '<img loading="lazy"><span></span>';
    a.firstChild.src = a.href; a.firstChild.alt = img.title;
    a.lastChild.textContent = img.title; a.title = img.title + ' (' + img.category + ')';
    a.onclick = e => { e.preventDefault(); openPhoto(a); };
    $('images').append(a);
  }
  // Filter buttons: "All" plus one per category. The choice is kept in the address (#Places & Maps) so it can be linked.
  const pick = cat => {
    for (const b of $('filters').children) b.setAttribute('aria-pressed', b.dataset.category === cat);
    for (const a of $('images').children) a.hidden = cat !== 'All' && a.dataset.category !== cat;
    if (!$('pictures').hidden) history.replaceState(null, '', '#' + (cat === 'All' ? 'pictures' : encodeURIComponent(cat)));
  };
  if (categories.length > 1) {
    for (const cat of ['All', ...categories]) {
      const b = document.createElement('button');
      b.type = 'button'; b.dataset.category = cat; b.textContent = cat;
      const n = cat === 'All' ? images.length : images.filter(i => i.category === cat).length;
      b.insertAdjacentHTML('beforeend', '<small>' + n + '</small>');
      b.onclick = () => pick(cat);
      $('filters').append(b);
    }
    const fromHash = decodeURIComponent(location.hash.slice(1));
    pick(categories.includes(fromHash) ? fromHash : 'All');
  }
  // The two big buttons: show Pictures & Maps or All Files (click again to hide).
  const openPanel = (name, scroll) => {
    for (const b of document.querySelectorAll('.hub button')) b.setAttribute('aria-pressed', b.dataset.panel === name);
    $('pictures').hidden = name !== 'pictures'; $('files').hidden = name !== 'files';
    if (name === 'pictures') { const on = [...$('filters').children].find(b => b.getAttribute('aria-pressed') === 'true'); pick(on ? on.dataset.category : 'All'); }
    else history.replaceState(null, '', name ? '#' + name : location.pathname + location.search);
    if (name && scroll) $(name).scrollIntoView({ behavior: 'smooth', block: 'start' });
  };
  for (const b of document.querySelectorAll('.hub button'))
    b.onclick = () => openPanel(b.getAttribute('aria-pressed') === 'true' ? null : b.dataset.panel, true);
  const startHash = decodeURIComponent(location.hash.slice(1));
  if (startHash === 'files') openPanel('files');
  else if (startHash === 'pictures' || categories.includes(startHash)) openPanel('pictures');
  const openText = async href => {
    const pre = document.createElement('pre'); current = -1;
    pre.textContent = await (await fetch(href)).text();
    show(pre);
  };
  const openRecap = async href => {
    current = -1;
    const art = document.createElement('article');
    art.className = 'recap';
    art.innerHTML = renderRecap(await (await fetch(href)).text());
    show(art); art.scrollTop = 0;
  };
  // Session recaps ("Session 03 – The Pattern and the Padre.md") become buttons
  // at the top: "S3 - The Pattern & the Padre". Everything else stays under Text files.
  const SESSION = /^Session\s+0*(\d+)\s*[–—-]\s*(.+)\.(md|txt)$/i;
  const recaps = texts.filter(f => SESSION.test(f))
    .map(f => { const [, n, title] = f.match(SESSION); return { f, n: +n, title: title.replace(/ and /gi, ' & ') }; })
    .sort((a, b) => a.n - b.n);
  for (const r of recaps) {
    const b = document.createElement('button');
    b.type = 'button'; b.innerHTML = '<b></b> ';
    b.firstChild.textContent = 'S' + r.n; b.append('- ' + r.title);
    b.title = r.f; b.onclick = () => openRecap(url('texts', r.f));
    $('recaps').append(b);
  }
  for (const f of texts.filter(f => !SESSION.test(f))) {
    const li = document.createElement('li'), a = document.createElement('a');
    a.href = url('texts', f); a.textContent = f;
    a.onclick = e => { e.preventDefault(); openText(a.href); };
    li.append(a); $('texts').append(li);
  }
  for (const f of pdfs) {
    const li = document.createElement('li'), a = document.createElement('a');
    a.href = url('pdfs', f); a.textContent = f; a.target = '_blank'; a.rel = 'noopener';
    li.append(a); $('pdfs').append(li);
  }
  for (const f of docs) {
    const li = document.createElement('li'), a = document.createElement('a');
    a.href = f.split('/').map(encodeURIComponent).join('/'); a.textContent = f.split('/').pop(); a.download = '';
    li.append(a); $('docs').append(li);
  }
  // Preview list on the All Files button: as many file names as fit, then "+ N more".
  const allFiles = [...texts.filter(f => !SESSION.test(f)), ...pdfs, ...docs.map(f => f.split('/').pop())]
    .map(f => f.replace(/\.[^.]+$/, ''));
  const fitPeek = () => {
    const ul = $('peek'), room = ul.parentElement.clientHeight - ul.parentElement.querySelector('.label').offsetHeight - 20;
    ul.replaceChildren();
    for (let i = 0; i < allFiles.length; i++) {
      const li = document.createElement('li'); li.textContent = allFiles[i]; ul.append(li);
      if (ul.offsetHeight > room) {
        li.remove();
        if (ul.lastChild) ul.lastChild.remove();
        const more = document.createElement('li'); more.className = 'more';
        more.textContent = '+ ' + (allFiles.length - ul.children.length) + ' more'; ul.append(more);
        break;
      }
    }
  };
  fitPeek(); addEventListener('resize', fitPeek);
  document.fonts.ready.then(fitPeek);
  for (const [list, heading] of [['recaps', 'recaps-h'], ['images', 'images-h'], ['texts', 'texts-h'], ['pdfs', 'pdfs-h'], ['docs', 'docs-h']])
    if (!$(list).children.length) $(heading).hidden = true;
}).catch(() => { document.body.insertAdjacentHTML('beforeend', '<p>Could not load files.json — run <code>node build.js</code>.</p>'); });
</script>
</body>
</html>
